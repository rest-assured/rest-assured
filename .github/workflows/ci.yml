---
name: Java CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        java: [17, 21, 25]
      fail-fast: false
      max-parallel: 4
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: 'maven'
      - name: Verify with Maven
        run: mvn verify -B -Posgi-tests

  jayway:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # json-path-jayway supports Jayway JsonPath 2.8.0 and later, and is built with 3.0.0
        jayway: [2.8.0, 2.9.0, 2.10.0, 3.0.0]
      fail-fast: false
    name: Test Jayway JsonPath ${{ matrix.jayway }}, JDK 17

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'maven'
      - name: Verify json-path-jayway, the Spring modules and the integration tests with Maven
        run: mvn verify -B -Djayway.version=${{ matrix.jayway }} -pl modules/json-path-jayway,modules/spring-mock-mvc,modules/spring-web-test-client,examples/rest-assured-itest-java -am

  apache5:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # http-client-apache5 supports Apache HttpClient 5.2.1 and later, and is built with 5.6.5. Each entry compiles the
        # module against that version and runs its tests and the integration tests with it: 5.2.1, the minimum, and the
        # newest patch of each later line
        httpclient5: [5.2.1, 5.3.1, 5.4.4, 5.5.2, 5.6.5]
      fail-fast: false
    name: Test Apache HttpClient ${{ matrix.httpclient5 }}, JDK 17

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'maven'
      - name: Verify http-client-apache5 and the integration tests with Apache HttpClient 5 with Maven
        run: mvn verify -B -Papache5 -Dhttpclient5.version=${{ matrix.httpclient5 }} -pl modules/http-client-apache5,examples/rest-assured-itest-java -am
