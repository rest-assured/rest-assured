---
name: Java CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        java: [17, 21, 25]
      fail-fast: false
      max-parallel: 4
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: 'maven'
      - name: Verify with Maven
        run: mvn verify -B -Posgi-tests

  jayway:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # json-path-jayway supports Jayway JsonPath 2.8.0 and later, and is built with 3.0.0
        jayway: [2.8.0, 2.9.0, 2.10.0, 3.0.0]
      fail-fast: false
    name: Test Jayway JsonPath ${{ matrix.jayway }}, JDK 17

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'maven'
      - name: Verify json-path-jayway, the Spring modules and the integration tests with Maven
        run: mvn verify -B -Djayway.version=${{ matrix.jayway }} -pl modules/json-path-jayway,modules/spring-mock-mvc,modules/spring-web-test-client,examples/rest-assured-itest-java -am

  spring:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The Spring modules are built with Spring Framework 7.0 (spring.version in their poms) and also support 6.2. Each entry
        # compiles and tests them with one Spring line: 6.2 with the Spring Security, REST Docs and servlet API versions that
        # Spring Boot 3.5 manages, and the build's versions
        include:
          - spring: 6.2.19
            overrides: -Dspring.version=6.2.19 -Dspring.security.version=6.5.11 -Dspring.restdocs.version=3.0.6 -Dservlet-api.version=6.0.0
          - spring: 7.0.10
            overrides: ''
      fail-fast: false
    name: Test Spring Framework ${{ matrix.spring }}, JDK 17

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'maven'
      - name: Verify the Spring modules and their Kotlin extensions with Maven
        run: mvn verify -B ${{ matrix.overrides }} -pl modules/spring-mock-mvc,modules/spring-web-test-client,modules/spring-mock-mvc-kotlin-extensions,modules/spring-web-test-client-kotlin-extensions -am

  apache5:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # http-client-apache5 supports Apache HttpClient 5.2.1 and later, and is built with 5.6.5. Each entry compiles the
        # module against that version and runs its tests and the integration tests with it: 5.2.1, the minimum, and the
        # newest patch of each later line
        httpclient5: [5.2.1, 5.3.1, 5.4.4, 5.5.2, 5.6.5]
      fail-fast: false
    name: Test Apache HttpClient ${{ matrix.httpclient5 }}, JDK 17

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'maven'
      - name: Verify http-client-apache5 and the integration tests with Apache HttpClient 5 with Maven
        run: mvn verify -B -Papache5 -Dhttpclient5.version=${{ matrix.httpclient5 }} -pl modules/http-client-apache5,examples/rest-assured-itest-java -am

  scala:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # scala-extensions is built with the Scala 3.3 LTS (scala3.version in the root pom), so that it works with every
        # newer Scala 3. This job compiles and tests it with the latest Scala 3, so that a break shows up here first
        scala: [3.10.0]
      fail-fast: false
    name: Test scala-extensions with Scala ${{ matrix.scala }}, JDK 17

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'maven'
      - name: Verify scala-extensions with Maven
        run: mvn verify -B -Dscala3.version=${{ matrix.scala }} -pl modules/scala-extensions -am

  groovy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # json-path-gpath and xml-path-gpath are built with Groovy 5.1.3 (groovy.version in the root pom), which the test job
        # tests, and support Groovy 4.0 to 6.x. Each entry runs their tests and the integration tests on that Groovy with the
        # classes built with 5.1.3, which is what users run. Spring Boot 3.5 manages Groovy 4.0.x, and Spring Boot 4.0 5.0.x
        groovy: [4.0.33, 5.0.8, 6.0.0]
      fail-fast: false
    name: Test Groovy ${{ matrix.groovy }}, JDK 17

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'maven'
      - name: Build the GPath modules and the integration tests with the build's Groovy with Maven
        run: mvn verify -B -DskipTests -pl json-path-gpath,xml-path-gpath,examples/rest-assured-itest-java -am
      - name: Verify the GPath modules and the integration tests on Groovy ${{ matrix.groovy }}, without compiling the main code again
        run: mvn verify -B -Pgroovy-runtime -Dmaven.main.skip -Dgroovy.version=${{ matrix.groovy }} -pl json-path-gpath,xml-path-gpath,examples/rest-assured-itest-java -am
