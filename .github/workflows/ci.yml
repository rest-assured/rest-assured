---
name: Java CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        java: [17, 21, 25]
      fail-fast: false
      max-parallel: 4
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
      - name: Verify with Maven
        run: mvn verify -B -Posgi-tests

  jayway:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # json-path-jayway supports Jayway JsonPath 2.8.0 and later, and is built with 2.10.0
        jayway: [2.8.0, 2.9.0, 2.10.0, 3.0.0]
      fail-fast: false
    name: Test Jayway JsonPath ${{ matrix.jayway }}, JDK 17

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Verify json-path-jayway, the Spring modules and the integration tests with Maven
        run: mvn verify -B -Djayway.version=${{ matrix.jayway }} -pl modules/json-path-jayway,modules/spring-mock-mvc,modules/spring-web-test-client,examples/rest-assured-itest-java -am

  jdk-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # HttpClient.close() exists from Java 21, so 17 and 21 take different paths
        java: [17, 21]
      fail-fast: false
    name: Test on the JDK HTTP client, JDK ${{ matrix.java }}

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
      # Until http-client-jdk is the default, the system property makes the tests send their requests with it
      - name: Verify the modules that send requests with Maven
        run: mvn verify -B -Drestassured.http.client=jdk -pl rest-assured,examples/rest-assured-itest-java,examples/kotlin-example,examples/scala-example,examples/scala3-example,examples/jackson3-example,examples/spring-mvc-webapp,examples/spring7-mvc-webapp -am
